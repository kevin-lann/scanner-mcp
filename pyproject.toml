[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horus-mcp"
version = "0.1.0"
description = "MCP server for market research, signal scanning, and charts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.9",
    "pydantic>=2.0",
    "yfinance>=0.2",
    "pandas>=2.0",
    "numpy>=1.26",
    "apscheduler>=3.10",
    "plotly>=6.1.1",
    "kaleido>=1.0,<2",
    "plyer>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only needed to connect to a remote Turso database (`TURSO_DATABASE_URL=libsql://...`).
# Standalone/local MCP usage never requires this.
turso = ["libsql>=0.1.8,<0.2"]

[project.scripts]
horus-mcp = "scanner_mcp.server:main"
horus-mcp-http = "scanner_mcp.server:main_http"

[tool.setuptools.packages.find]
where = ["src"]
